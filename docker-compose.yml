services:
  app:
    image: repo.strolch.li/docker/chronivaro:latest
    container_name: chronivaro
    hostname: app
    ports:
      - 127.0.0.1:8080:8080
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - TZ=Europe/Zurich
      - STROLCH_ENVIRONMENT=dev
      - PORT=8080
    volumes:
      - ./runtime:/chronivaro-runtime
    restart: unless-stopped
