openapi: 3.0.3
info:
  title: Chronivaro REST API
  description: |
    REST API specification for Chronivaro, a Resource-Order-Activity time tracking and absence management system built on Strolch.
    Provides endpoints for time tracking, timers, presence overview, absence requests, period closing, reports, and administrative management.
  version: 0.1.0-SNAPSHOT
  license:
    name: GNU Affero General Public License v3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Chronivaro
    url: https://github.com/eitch/Chronivaro
servers:
  - url: /
    description: Current server instance

paths:
  # ==========================================
  # System & Authentication
  # ==========================================
  /chronivaro/v1/version:
    get:
      summary: Get application version and build metadata
      description: Returns the application version, build timestamp, environment mode, and Strolch version.
      operationId: getVersion
      tags:
        - System
      responses:
        '200':
          description: Version metadata retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/system/health:
    get:
      summary: Get system health status
      description: Liveness probe returning whether the Strolch agent and server are running.
      operationId: getSystemHealth
      tags:
        - System
      responses:
        '200':
          description: System health status retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/system/readiness:
    get:
      summary: Get system readiness status
      description: Readiness probe returning 200 when realms and components are initialized and ready to serve traffic.
      operationId: getSystemReadiness
      tags:
        - System
      responses:
        '200':
          description: System is ready to accept traffic
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessDto'
        '503':
          description: System is not ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/system/version:
    get:
      summary: Get system version metadata
      description: Returns the application version, build timestamp, environment mode, and Strolch version.
      operationId: getSystemVersion
      tags:
        - System
      responses:
        '200':
          description: Version metadata retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/system/metrics:
    get:
      summary: Get system and JVM telemetry metrics
      description: Returns JVM heap, non-heap, thread pool, CPU load, and system metrics.
      operationId: getSystemMetrics
      tags:
        - System
      responses:
        '200':
          description: System metrics retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetricsDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/auth/login:
    post:
      summary: User login
      description: Authenticates user credentials and sets session cookie or returns authentication certificate token.
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: strolch.authorization=Bearer abc123xyz; Path=/; HttpOnly; SameSite=Strict
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/auth/logout:
    post:
      summary: User logout
      description: Invalidates active user session and clears authentication cookies.
      operationId: logout
      tags:
        - Authentication
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/auth/me:
    get:
      summary: Current user profile
      description: Returns authenticated user identity, assigned employee ID, and system roles.
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/auth/initiate-registration:
    post:
      summary: Initiate employee registration
      description: Triggers self-registration invitation workflow for an employee by generating a registration token and sending an email.
      operationId: initiateRegistration
      tags:
        - Authentication
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInitiateRequestDto'
      responses:
        '200':
          description: Registration initiated successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/auth/complete-registration:
    post:
      summary: Complete employee registration
      description: Activates user account with provided invitation token and sets the initial password.
      operationId: completeRegistration
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCompleteRequestDto'
      responses:
        '200':
          description: Registration completed successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # Presence
  # ==========================================
  /chronivaro/v1/presence:
    get:
      summary: Get system-wide presence overview
      description: Returns real-time working status for all active employees. Presence reason is abstracted based on role privileges.
      operationId: getPresenceOverview
      tags:
        - Presence
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: teamId
          in: query
          description: Filter by team ID
          required: false
          schema:
            type: string
        - name: locationId
          in: query
          description: Filter by location ID
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Presence list retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/PresenceDto'
                  - $ref: '#/components/schemas/PagedPresenceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/presence/team/{teamId}:
    get:
      summary: Get team presence overview
      description: Returns real-time presence status for all employees in the specified team.
      operationId: getTeamPresence
      tags:
        - Presence
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          description: Team identifier
          schema:
            type: string
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Team presence list retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/PresenceDto'
                  - $ref: '#/components/schemas/PagedPresenceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/presence/employee/{employeeId}:
    get:
      summary: Get employee presence status
      description: Returns real-time presence status for a specific employee.
      operationId: getEmployeePresence
      tags:
        - Presence
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          description: Employee identifier
          schema:
            type: string
      responses:
        '200':
          description: Employee presence retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # Timer & Work Entries
  # ==========================================
  /chronivaro/v1/timer/start:
    post:
      summary: Start work timer
      description: Starts an active timer for the logged-in employee with an optional working location.
      operationId: startTimer
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTimerRequestDto'
      responses:
        '200':
          description: Timer started successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerStatusDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/timer/stop:
    post:
      summary: Stop work timer
      description: Stops the active timer and records a completed work entry for the day.
      operationId: stopTimer
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopTimerRequestDto'
      responses:
        '200':
          description: Timer stopped successfully and work entry created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEntryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/timer/status:
    get:
      summary: Get active timer status
      description: Returns the status of the current user's timer, start time, and accumulated duration today.
      operationId: getTimerStatus
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Timer status retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/work-entries:
    post:
      summary: Add work entry manually
      description: Creates a manual work entry with start/end timestamps and location for a specific day.
      operationId: addWorkEntry
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkEntryCreateDto'
      responses:
        '200':
          description: Work entry created successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEntryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/work-entries/day/{date}:
    get:
      summary: Get work entries for day
      description: Retrieves all recorded work entries for a specific date (YYYY-MM-DD).
      operationId: getWorkEntriesForDay
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          description: Target date formatted as YYYY-MM-DD
          schema:
            type: string
            format: date
            example: '2026-08-18'
        - name: employeeId
          in: query
          description: Employee ID (requires supervisor/admin privilege if querying another employee)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Work entries retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkEntryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/work-entries/{id}:
    put:
      summary: Correct work entry
      description: Updates an existing work entry time range, comment, or location. Supports optimistic concurrency via `If-Match`.
      operationId: updateWorkEntry
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Work entry identifier
          schema:
            type: string
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkEntryUpdateDto'
      responses:
        '200':
          description: Work entry updated successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEntryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete work entry
      description: Removes a recorded work entry from the work day. Supports optimistic concurrency via `If-Match`.
      operationId: deleteWorkEntry
      tags:
        - Time Tracking
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Work entry identifier
          schema:
            type: string
        - $ref: '#/components/parameters/IfMatchParam'
      responses:
        '200':
          description: Work entry deleted successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # Summaries & Reports
  # ==========================================
  /chronivaro/v1/summary/day/{date}:
    get:
      summary: Get day summary
      description: Returns target minutes, actual recorded minutes, holiday credits, absences, computed balance, and gap-based breaks.
      operationId: getDaySummary
      tags:
        - Summaries
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          description: Target date formatted as YYYY-MM-DD
          schema:
            type: string
            format: date
            example: '2026-08-18'
        - name: employeeId
          in: query
          description: Employee ID (optional, defaults to current user's employee)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Day summary retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaySummaryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/summary/month/{yearMonth}:
    get:
      summary: Get month summary
      description: Returns full monthly aggregation including starting balance, monthly actuals, holiday/absence credits, end balance, and daily breakdown.
      operationId: getMonthSummary
      tags:
        - Summaries
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: yearMonth
          in: path
          required: true
          description: Target month formatted as YYYY-MM
          schema:
            type: string
            example: '2026-08'
        - name: employeeId
          in: query
          description: Employee ID (optional, defaults to current user's employee)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Month summary retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthSummaryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # Reports & CSV Export
  # ==========================================
  /chronivaro/v1/reports/day:
    get:
      summary: Get day report
      description: Returns daily time breakdown and summaries in JSON or CSV format.
      operationId: getDayReport
      tags:
        - Reports
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          description: Target date formatted as YYYY-MM-DD
          schema:
            type: string
            format: date
            example: '2026-08-18'
        - name: employeeId
          in: query
          description: Employee ID (optional, defaults to current user's employee)
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: Output format (json or csv)
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Day report retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaySummaryDto'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/reports/month:
    get:
      summary: Get month report
      description: Returns monthly summary aggregation and daily breakdown in JSON or CSV format.
      operationId: getMonthReport
      tags:
        - Reports
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: yearMonth
          in: query
          required: true
          description: Target month formatted as YYYY-MM
          schema:
            type: string
            example: '2026-08'
        - name: employeeId
          in: query
          description: Employee ID (optional, defaults to current user's employee)
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: Output format (json or csv)
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Month report retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthSummaryDto'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/reports/vacation:
    get:
      summary: Get vacation report
      description: Returns yearly vacation account summary and journal entries in JSON or CSV format.
      operationId: getVacationReport
      tags:
        - Reports
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          description: Calendar year (defaults to current year)
          schema:
            type: integer
            example: 2026
        - name: employeeId
          in: query
          description: Employee ID (optional, defaults to current user's employee)
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: Output format (json or csv)
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Vacation report retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationAccountSummaryDto'
            text/csv:
              schema:
                type: string
