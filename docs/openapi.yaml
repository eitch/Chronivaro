        - $ref: '#/components/parameters/LimitParam'
        - name: entityType
          in: query
          required: false
          description: Entity type filter (e.g., Employee, Absence, WorkEntry)
          schema:
            type: string
        - name: entityId
          in: query
          required: false
          description: Specific entity identifier
          schema:
            type: string
        - name: username
          in: query
          required: false
          description: Performed by username
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Earliest audit log timestamp (ISO)
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Latest audit log timestamp (ISO)
          schema:
            type: string
      responses:
        '200':
          description: Audit logs retrieved successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AuditLogDto'
                  - $ref: '#/components/schemas/PagedAuditLogDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/admin/configuration:
    get:
      summary: Get global system configuration
      description: Returns tenant-wide settings (e.g. grace periods, default break rules, holiday calendars).
      operationId: getConfiguration
      tags:
        - Admin - Audits & Configuration
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Configuration retrieved successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update global system configuration
      description: Updates system configuration parameters. Supports optimistic concurrency via `If-Match`.
      operationId: updateConfiguration
      tags:
        - Admin - Audits & Configuration
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDto'
      responses:
        '200':
          description: Configuration updated successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chronivaro/v1/admin/corrections:
    post:
      summary: Perform manual balance or time correction
      description: Applies a privileged manual adjustment or time credit directly to an employee record.
      operationId: executeManualCorrection
      tags:
        - Admin - Audits & Configuration
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCorrectionRequestDto'
      responses:
        '200':
          description: Manual correction applied successfully
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ==========================================
# Components
# ==========================================
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: strolch.authorization
      description: Strolch session cookie containing the user authentication token.
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token containing the Strolch user certificate ID.

  headers:
    ETag:
      description: Entity version validator for optimistic concurrency control (e.g., W/"1" or "1").
      schema:
        type: string
        example: '"1"'
    If-Match:
      description: Precondition header requiring the client's cached entity version before mutation.
      schema:
        type: string
        example: '"1"'
    X-Correlation-Id:
      description: Unique identifier for tracking and correlating requests across logs and client telemetry.
      schema:
        type: string
        format: uuid
        example: '4a1b0289-53e7-4b72-bdf4-f8b898ecb817'

  parameters:
    OffsetParam:
      name: offset
      in: query
      description: Zero-based item offset for pagination (defaults to 0).
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    LimitParam:
      name: limit
      in: query
      description: Number of items to return (defaults to 50, maximum 1000).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
        example: 50
    IfMatchParam:
      name: If-Match
      in: header
      required: false
      description: Target entity version for optimistic concurrency control.
      schema:
        type: string
        example: '"1"'

  responses:
    BadRequest:
      description: Bad request - Validation failure or malformed payload
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Unauthorized:
      description: Unauthorized - Authentication is missing or invalid
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Forbidden:
      description: Forbidden - Insufficient user privileges or role permissions
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    NotFound:
      description: Not found - Requested resource does not exist
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Conflict:
      description: Conflict - Concurrency mismatch (stale If-Match) or business state violation
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    InternalServerError:
      description: Internal server error - Unexpected system failure
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'

  schemas:
    # ------------------------------------------
    # Error & Common Models
    # ------------------------------------------
    ErrorDto:
      type: object
      required:
        - error
        - code
        - message
        - correlationId
      properties:
        error:
          type: boolean
          example: true
        code:
          type: string
          example: 'VALIDATION_ERROR'
        message:
          type: string
          example: 'Invalid input parameters'
        correlationId:
          type: string
          example: '4a1b0289-53e7-4b72-bdf4-f8b898ecb817'
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDto'

    FieldErrorDto:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: 'email'
        message:
          type: string
          example: 'Email address is invalid'

    SuccessResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'

    ActionCommentDto:
      type: object
      properties:
        comment:
          type: string
          example: 'Approved based on team coverage agreement'

    VersionDto:
      type: object
      properties:
        version:
          type: string
          example: '0.1.0-SNAPSHOT'
        buildTimestamp:
          type: string
          example: '2026-08-18 10:00:00'
        environment:
          type: string
          example: 'DEVELOPMENT'
        strolchVersion:
          type: string
          example: '2.7.0-SNAPSHOT'

    HealthDto:
      type: object
      properties:
        status:
          type: string
          example: 'UP'
        agentState:
          type: string
          example: 'RUNNING'
        uptimeMs:
          type: integer
          format: int64
          example: 45230
        timestamp:
          type: string
          example: '2026-08-19T13:30:00.000+02:00'

    ReadinessDto:
      type: object
      properties:
        status:
          type: string
          example: 'READY'
        agentState:
          type: string
          example: 'RUNNING'
        activeRealms:
          type: array
          items:
            type: string
          example: ['strolch']
        timestamp:
          type: string
          example: '2026-08-19T13:30:00.000+02:00'

    SystemMetricsDto:
      type: object
      properties:
        heapUsedBytes:
          type: integer
          format: int64
          example: 84934656
        heapMaxBytes:
          type: integer
          format: int64
          example: 4294967296
        heapFreeBytes:
          type: integer
          format: int64
          example: 182452224
        nonHeapUsedBytes:
          type: integer
          format: int64
          example: 52428800
        activeThreads:
          type: integer
          example: 24
        peakThreadCount:
          type: integer
          example: 32
        totalStartedThreadCount:
          type: integer
          format: int64
          example: 58
        availableProcessors:
          type: integer
          example: 8
        systemLoadAverage:
          type: number
          format: double
          example: 1.45
        uptimeMs:
          type: integer
          format: int64
          example: 45230
        timestamp:
          type: string
          example: '2026-08-19T13:30:00.000+02:00'

    # ------------------------------------------
    # Auth & Users
    # ------------------------------------------
    LoginRequestDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: 'admin'
        password:
          type: string
          format: password
          example: 'Secret123!'

    LoginResponseDto:
      type: object
      properties:
        token:
          type: string
          example: 'abc123token'
